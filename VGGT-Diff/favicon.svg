<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">VGGT-Diff</title>
  <desc id="desc">Visual geometry particles flowing into an elegant diffusion D.</desc>
  <defs>
    <linearGradient id="bg" x1="7" y1="7" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#063d5d"/>
      <stop offset=".48" stop-color="#187f9d"/>
      <stop offset="1" stop-color="#9a286f"/>
    </linearGradient>
    <linearGradient id="flow" x1="9" y1="32" x2="31" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7de1ee" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".94"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.2" flood-color="#241129" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="11" fill="url(#bg)"/>
  <path d="M8 32c7.5-7 13.2-6.8 21.5-.8" fill="none" stroke="url(#flow)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="10" cy="32.1" r="2.2" fill="#7de1ee" opacity=".62"/>
  <circle cx="17.2" cy="28.1" r="1.65" fill="#b8f2f6" opacity=".78"/>
  <circle cx="24.1" cy="28.8" r="1.25" fill="#fff" opacity=".9"/>

  <text x="39" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-style="italic" font-weight="700" fill="#fff" filter="url(#soft-shadow)">D</text>
  <path d="M27.5 42.6c5 2 9.8 2 14.4-.2" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".28"/>
</svg>
